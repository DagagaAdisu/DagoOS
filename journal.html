    <header class="header">
      <div class="header__title">Dago Journal</div>
      <div class="header__actions">
        <div id="auth-area" class="auth-area"></div>
      </div>
    </header>

    <main class="main">

      <div class="page-header">
        <h1 class="page-header__title">Dago Journal</h1>
        <p class="page-header__subtitle">Memories, notes, reflections.</p>
      </div>

      <!-- Entries list (data first) -->
      <section class="card">
        <h2 class="card__title">Entries</h2>
        <div id="entry-list" class="entry-list"></div>
        <p id="entry-empty" class="empty-state hidden">
          No entries yet. Write your first one below.
        </p>
      </section>

      <!-- New / edit entry form -->
      <section class="card">
        <h2 class="card__title" id="entry-form-title">New entry</h2>

        <form id="entry-form" class="form-grid">

          <label class="field field--wide">
            <span class="field__label">Title</span>
            <input id="entry-title" class="field__input" type="text"
                   placeholder="Give this entry a title" />
          </label>

          <label class="field">
            <span class="field__label">Date</span>
            <input id="entry-date" class="field__input" type="date" required />
          </label>

          <label class="field">
            <span class="field__label">Mood</span>
            <select id="entry-mood" class="field__input">
              <option value="">—</option>
              <option value="bad">Bad</option>
              <option value="ok">OK</option>
              <option value="good">Good</option>
              <option value="great">Great</option>
            </select>
          </label>

          <label class="field field--wide">
            <span class="field__label">Tags (comma separated)</span>
            <input id="entry-tags" class="field__input" type="text"
                   placeholder="personal, reflection, work" />
          </label>

          <label class="field field--wide">
            <span class="field__label">Body (markdown supported)</span>
            <textarea id="entry-body" class="field__input field__input--textarea"
                      rows="8"
                      placeholder="# Today&#10;&#10;Use **bold**, *italic*, `code`, and&#10;&#10;- lists&#10;- like this"></textarea>
          </label>

          <div class="field field--wide entry-preview-wrap">
            <span class="field__label">Live preview</span>
            <div id="entry-preview" class="entry-preview markdown"></div>
          </div>

          <div class="field field--wide field--actions entry-form-actions">
            <button id="entry-submit" class="btn btn--primary" type="submit">
              Add entry
            </button>
            <button id="entry-cancel" class="btn btn--ghost hidden" type="button">
              Cancel
            </button>
          </div>

        </form>
      </section>

    </main>

  </div>
