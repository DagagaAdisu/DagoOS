    <header class="header">
      <div class="header__title">Dago Todo</div>
      <div class="header__actions">
        <div id="auth-area" class="auth-area"></div>
      </div>
    </header>

    <main class="main">

      <div class="page-header">
        <h1 class="page-header__title">Dago Todo</h1>
        <p class="page-header__subtitle">Tasks, habits, and things to remember.</p>
      </div>

      <!-- Quick add -->
      <form id="todo-quick-form" class="todo-quick-add">
        <input id="todo-quick-add" class="field__input"
               type="text"
               placeholder="Quick add a task… press Enter" />
      </form>

      <!-- Toolbar -->
      <section class="vault-toolbar">
        <div class="vault-toolbar__search">
          <input id="todo-search" class="field__input" type="search"
                 placeholder="Search tasks…" />
        </div>
        <div class="vault-toolbar__actions">
          <select id="todo-sort" class="field__input"></select>
        </div>
      </section>

      <!-- Filter tabs -->
      <section class="vault-tabs-wrap">
        <div id="todo-tabs" class="tabs"></div>
      </section>

      <!-- Bulk actions bar -->
      <div id="todo-bulk-bar" class="vault-bulk-bar hidden">
        <span id="todo-bulk-count" class="vault-bulk-bar__count">0 selected</span>
        <button id="todo-bulk-complete" class="btn btn--ghost btn--sm" type="button">Complete</button>
        <button id="todo-bulk-delete" class="btn btn--danger btn--sm" type="button">Delete</button>
        <button id="todo-bulk-clear" class="btn btn--ghost btn--sm" type="button">Clear</button>
      </div>

      <!-- List -->
      <section class="card">
        <div id="todo-list" class="todo-list"></div>
        <p id="todo-empty" class="empty-state hidden">
          No tasks here. Tap <strong>+</strong> or use the quick-add above.
        </p>
      </section>

    </main>

  </div>

  <!-- Floating action button -->
  <button id="todo-fab" class="fab" type="button" title="Add task" aria-label="Add task">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Add/Edit modal -->
  <div id="todo-add-modal" class="modal-backdrop hidden">
    <div class="modal modal--wide">
      <button id="todo-add-close" class="modal__close" type="button" aria-label="Close">×</button>
      <h2 class="modal__title" id="todo-add-title">Add task</h2>

      <form id="todo-form" class="form-grid">

        <label class="field field--wide">
          <span class="field__label">Title</span>
          <input id="todo-title" class="field__input" type="text"
                 placeholder="Finish Linear Algebra assignment" required />
        </label>

        <label class="field field--wide">
          <span class="field__label">Description (optional)</span>
          <textarea id="todo-description" class="field__input field__input--textarea"
                    rows="3" placeholder="Details…"></textarea>
        </label>

        <label class="field">
          <span class="field__label">Priority</span>
          <select id="todo-priority" class="field__input"></select>
        </label>

        <label class="field">
          <span class="field__label">Due date</span>
          <input id="todo-due-date" class="field__input" type="date" />
        </label>

        <label class="field">
          <span class="field__label">Recurring</span>
          <select id="todo-recurring" class="field__input"></select>
        </label>

        <label class="field">
          <span class="field__label">Tags</span>
          <input id="todo-tags" class="field__input" type="text"
                 list="todo-tags-list" placeholder="school, urgent" />
          <datalist id="todo-tags-list"></datalist>
        </label>

        <label class="field field--wide" style="flex-direction: row; align-items: center; gap: 8px;">
          <input id="todo-pinned" type="checkbox" />
          <span class="field__label" style="margin-bottom: 0;">Pin to top</span>
        </label>

        <div class="field field--wide">
          <span class="field__label">Subtasks (optional)</span>
          <div id="todo-subtasks" class="subtask-edit-list"></div>
          <div class="subtask-add-row">
            <input id="todo-subtask-input" class="field__input" type="text"
                   placeholder="Add a subtask and press Enter" />
            <button id="todo-subtask-add" class="btn btn--ghost btn--sm" type="button">Add</button>
          </div>
        </div>

        <div class="field field--wide field--actions entry-form-actions">
          <button id="todo-submit" class="btn btn--primary" type="submit">Add task</button>
          <button id="todo-cancel" class="btn btn--ghost" type="button">Cancel</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Detail modal -->
  <div id="todo-modal" class="modal-backdrop hidden">
    <div class="modal">
      <button id="todo-modal-close" class="modal__close" type="button" aria-label="Close">×</button>
      <div id="todo-modal-body" class="modal__body"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
